<svg fill="none" width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Typography */
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, SF Pro Display, Menlo, Monaco, Consolas, monospace; }

    /* Keyframe Animations */
    
    /* 1. Rotating React Atom */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .react-atom {
      transform-origin: 680px 85px;
      animation: spin 10s linear infinite;
    }

    /* 2. Flowing Dashed Lines */
    @keyframes dashFlow {
      to { stroke-dashoffset: -16; }
    }
    .flow-line {
      stroke-dasharray: 4, 4;
      animation: dashFlow 1.2s linear infinite;
    }

    /* 3. Pulsing Dot */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }
    .status-dot {
      transform-origin: 32px 36px;
      animation: pulse 2s ease-in-out infinite;
    }

    /* 4. Sequential Cycling Quote Text */
    @keyframes cycleText1 {
      0%, 28% { opacity: 1; transform: translateY(0px); }
      33%, 95% { opacity: 0; transform: translateY(-5px); }
      100% { opacity: 0; transform: translateY(0px); }
    }
    @keyframes cycleText2 {
      0%, 28% { opacity: 0; transform: translateY(5px); }
      33%, 61% { opacity: 1; transform: translateY(0px); }
      66%, 100% { opacity: 0; transform: translateY(-5px); }
    }
    @keyframes cycleText3 {
      0%, 61% { opacity: 0; transform: translateY(5px); }
      66%, 95% { opacity: 1; transform: translateY(0px); }
      100% { opacity: 0; transform: translateY(-5px); }
    }

    .quote-1 { animation: cycleText1 12s infinite; }
    .quote-2 { animation: cycleText2 12s infinite; }
    .quote-3 { animation: cycleText3 12s infinite; }

    /* Terminal Cursor Blink */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor { animation: blink 0.8s infinite; }
  </style>

  <!-- Container Box -->
  <rect width="800" height="320" rx="12" fill="url(#bg-grad)" stroke="#1f293d" stroke-width="1.5" />

  <!-- Top Status Badge -->
  <g transform="translate(32, 28)">
    <circle class="status-dot" cx="0" cy="8" r="4" fill="#10b981" />
    <text x="12" y="12" fill="#10b981" class="font-mono" font-size="11" font-weight="600" letter-spacing="1">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Title Section -->
  <text x="32" y="82" fill="#38bdf8" class="font-mono" font-size="12" font-weight="700" letter-spacing="2">FULL-STACK WEB DEVELOPER</text>
  <text x="32" y="122" fill="#f8fafc" class="font-sans" font-size="34" font-weight="800" letter-spacing="-0.5">Jhomar John Picar</text>
  <text x="32" y="148" fill="#94a3b8" class="font-sans" font-size="14" font-weight="400">Bridging 7 Years of IT Technical Support into Modern Web Engineering</text>

  <!-- Tech Stack Badges -->
  <g transform="translate(32, 175)">
    <!-- Badge: React -->
    <rect x="0" y="0" width="72" height="24" rx="12" fill="#0f172a" stroke="#1e293b" />
    <text x="36" y="16" fill="#38bdf8" class="font-mono" font-size="11" text-anchor="middle">React</text>

    <!-- Badge: Node.js -->
    <rect x="80" y="0" width="76" height="24" rx="12" fill="#0f172a" stroke="#1e293b" />
    <text x="118" y="16" fill="#4ade80" class="font-mono" font-size="11" text-anchor="middle">Node.js</text>

    <!-- Badge: MongoDB -->
    <rect x="164" y="0" width="84" height="24" rx="12" fill="#0f172a" stroke="#1e293b" />
    <text x="206" y="16" fill="#22c55e" class="font-mono" font-size="11" text-anchor="middle">MongoDB</text>

    <!-- Badge: Express -->
    <rect x="256" y="0" width="76" height="24" rx="12" fill="#0f172a" stroke="#1e293b" />
    <text x="294" y="16" fill="#cbd5e1" class="font-mono" font-size="11" text-anchor="middle">Express</text>

    <!-- Badge: REST API -->
    <rect x="340" y="0" width="80" height="24" rx="12" fill="#0f172a" stroke="#1e293b" />
    <text x="380" y="16" fill="#f43f5e" class="font-mono" font-size="11" text-anchor="middle">REST API</text>
  </g>

  <!-- RIGHT GRAPHICS SECTION (Architecture + Animated React Logo) -->

  <!-- Animated React Atom Logo -->
  <g class="react-atom">
    <ellipse cx="680" cy="85" rx="30" ry="11" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <ellipse cx="680" cy="85" rx="30" ry="11" fill="none" stroke="#38bdf8" stroke-width="1.5" transform="rotate(60, 680, 85)" />
    <ellipse cx="680" cy="85" rx="30" ry="11" fill="none" stroke="#38bdf8" stroke-width="1.5" transform="rotate(120, 680, 85)" />
    <circle cx="680" cy="85" r="4" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- System Architecture Flow Diagram -->
  <g transform="translate(530, 130)">
    <!-- Root Node: Client UI -->
    <rect x="60" y="0" width="90" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="105" y="18" fill="#38bdf8" class="font-mono" font-size="11" text-anchor="middle">&lt;Client /&gt;</text>

    <!-- Connecting Lines -->
    <path d="M 105 28 L 105 45 M 105 45 L 45 45 M 105 45 L 165 45 M 45 45 L 45 60 M 165 45 L 165 60" fill="none" stroke="#334155" stroke-width="1.5" />
    
    <!-- Flowing animated data indicators -->
    <path class="flow-line" d="M 105 28 L 105 45 M 105 45 L 45 45 L 45 60" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="flow-line" d="M 105 45 L 165 45 L 165 60" fill="none" stroke="#4ade80" stroke-width="1.5" />

    <!-- Node Left: Node / Express API -->
    <rect x="5" y="60" width="80" height="26" rx="5" fill="#0f172a" stroke="#334155" />
    <text x="45" y="77" fill="#94a3b8" class="font-mono" font-size="10" text-anchor="middle">Node API</text>

    <!-- Node Right: MongoDB -->
    <rect x="125" y="60" width="80" height="26" rx="5" fill="#0f172a" stroke="#334155" />
    <text x="165" y="77" fill="#94a3b8" class="font-mono" font-size="10" text-anchor="middle">MongoDB</text>
  </g>

  <!-- BOTTOM TERMINAL BAR (Dynamic Cycling Quotes) -->
  <g transform="translate(32, 235)">
    <rect width="736" height="42" rx="8" fill="#090d16" stroke="#1e293b" />
    
    <text x="16" y="25" fill="#38bdf8" class="font-mono" font-size="13" font-weight="bold">&gt;</text>

    <!-- Quote Option 1 -->
    <g class="quote-1">
      <text x="32" y="25" fill="#e2e8f0" class="font-mono" font-size="12">Build. Learn. Solve. Repeat. 🚀</text>
    </g>

    <!-- Quote Option 2 -->
    <g class="quote-2">
      <text x="32" y="25" fill="#e2e8f0" class="font-mono" font-size="12">Turning IT troubleshooting experience into production code 🧠</text>
    </g>

    <!-- Quote Option 3 -->
    <g class="quote-3">
      <text x="32" y="25" fill="#e2e8f0" class="font-mono" font-size="12">Currently building full-stack MERN web applications 🌐</text>
    </g>

    <!-- Cursor -->
    <rect class="cursor" x="520" y="14" width="7" height="14" fill="#38bdf8" />
  </g>
</svg>
